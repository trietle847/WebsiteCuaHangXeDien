<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chatbot cửa hàng xe máy điện</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #d9f1ff, #f8fcff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #chat-container {
        width: 420px;
        height: 600px;
        border-radius: 16px;
        background: white;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: fadeIn 0.6s ease;
      }

      #header {
        background: linear-gradient(90deg, #0078ff, #00c6ff);
        color: white;
        text-align: center;
        padding: 14px;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      #header .title {
        font-size: 19px;
        font-weight: 600;
      }

      #header .subtitle {
        font-size: 13px;
        font-weight: 400;
        opacity: 0.9;
        margin-top: 3px;
        font-style: italic;
      }

      #messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background: #f6f8fa;
      }

      .user-msg,
      .bot-msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 18px;
        margin: 8px 0;
        display: inline-block;
        line-height: 1.4;
        animation: popIn 0.3s ease-out;
      }

      .user-msg {
        background: #0078ff;
        color: white;
        align-self: flex-end;
        float: right;
        border-bottom-right-radius: 4px;
      }

      .bot-msg {
        background: #e5e7eb;
        color: #333;
        align-self: flex-start;
        float: left;
        border-bottom-left-radius: 4px;
      }

      #input-container {
        display: flex;
        border-top: 1px solid #ddd;
        background: #fafafa;
        padding: 10px;
      }

      #user-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 15px;
        padding: 10px;
        border-radius: 8px;
        background: #f0f2f5;
        transition: all 0.3s;
      }

      #user-input:focus {
        background: white;
        box-shadow: 0 0 4px rgba(0, 120, 255, 0.3);
      }

      #send-btn {
        background: #0078ff;
        color: white;
        border: none;
        padding: 10px 18px;
        margin-left: 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
      }

      #send-btn:hover {
        background: #005fcc;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #999;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div id="header">
        <div class="title">🤖 Chat với Emotor</div>
        <div class="subtitle">“Chạy xanh – Sống chất”</div>
      </div>

      <div id="messages"></div>
      <div id="input-container">
        <input
          id="user-input"
          type="text"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        />
        <button id="send-btn">Gửi</button>
      </div>
    </div>

    <script>
      const senderId = "user_" + Math.floor(Math.random() * 1000000);
      const rasaUrl = "http://localhost:5005/webhooks/rest/webhook";
      const messagesDiv = document.getElementById("messages");
      const input = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");

      function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.className = sender === "user" ? "user-msg" : "bot-msg";
        msg.textContent = text;
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, "user");
        input.value = "";

        try {
          const res = await fetch(rasaUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender: senderId, message: text }),
          });

          if (!res.ok) throw new Error("Lỗi khi kết nối Rasa");

          const data = await res.json();
          data.forEach((msg) => {
            if (msg.text) addMessage(msg.text, "bot");
          });
        } catch (err) {
          addMessage("⚠️ Không thể kết nối tới máy chủ Rasa!", "bot");
          console.error(err);
        }
      }

      sendBtn.onclick = sendMessage;
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
