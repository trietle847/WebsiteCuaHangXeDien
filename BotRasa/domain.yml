  - hoi_rating
  # - hoi_ton_kho_mau

entities:
  - mau_xe
  - thuong_hieu

slots:
  mau_xe:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: mau_xe

  thuong_hieu:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: thuong_hieu

responses:
  # ==== CHÀO HỎI ====
  utter_chao_hoi:
    - text: "Chào bạn 😄! Mình là trợ lý ảo của cửa hàng xe máy điện Emotor. Mình có thể giúp bạn tra giá, xem xe hoặc tư vấn khuyến mãi. Bạn cần hỗ trợ gì nào?"

  # ==== HỎI GIÁ XE ====
  # utter_hoi_gia:
  #   - text: "Giá xe bên em giao động từ 13-70 triệu tùy mẫu ạ. Bạn muốn hỏi giá xe nào ạ? "
  #   - text: "Dạ, bạn cho em biết tên xe để em báo giá chính xác nhé "

  # ==== HỎI KHUYẾN MÃI ====
  utter_hoi_khuyen_mai:
    - text: "Hiện cửa hàng đang có <b>khuyến mãi giảm 10% và tặng nón bảo hiểm</b> khi mua xe trong tháng này."

  # ==== HỎI LOẠI XE ====
  utter_hoi_loai_xe:
    - text: "Bên em có các dòng: xe ga điện, xe thể thao điện, xe mini cho học sinh."

  # ==== HỎI THƯƠNG HIỆU ====
  utter_hoi_thuong_hieu:
    - text: "Bên em chuyên phân phối các hãng <b>MOVE, YADEA, DIBAO, NIJIA, YAMAHA NEO, HONDA ICON, VinFast</b>"

  # ==== HỎI BẢO HÀNH ====
  utter_hoi_bao_hanh:
    - text: "Tất cả xe đều được <b>bảo hành</b> <b>3 năm</b> cho động cơ và <b>2 năm</b> cho pin."
    - text: "Xe được <b>bảo hành toàn quốc 36 tháng</b>, pin và sạc được đổi mới nếu lỗi kỹ thuật."

  # ==== HỎI ĐỊA CHỈ ====
  utter_hoi_dia_chi:
    - text: "Cửa hàng chính: <b>📍 278 Tầm Vu, p. Tân An, Tp. Cần Thơ.</b>"

  # ==== HỎI MUA XE ====
  utter_hoi_mua_xe:
    - text: "Bạn có thể đặt xe trực tiếp trên website hoặc đến Emotor <b>📍 278 Tầm Vu, p. Tân An, Tp. Cần Thơ.</b> Bên em có hỗ trợ <b>trả góp 0%</b>, <b>đặt cọc online</b>, và <b>giao xe tận nơi</b> luôn nha!"

  # ==== HỎI HỖ TRỢ KỸ THUẬT ====
  utter_hoi_ho_tro:
    - text: "Em rất tiếc về sự cố! Bạn vui lòng cho em biết xe đang gặp lỗi gì để hỗ trợ nhanh nhất."

  # ==== CẢM ƠN ====
  utter_cam_on:
    - text: "Không có gì ạ 😊, rất vui được hỗ trợ bạn!"
    - text: "Em cảm ơn bạn nhiều nha 💚. Chúc bạn một ngày tuyệt vời!"

  # ==== TẠM BIỆT ====
  utter_tam_biet:
    - text: "Tạm biệt bạn 👋, hẹn gặp lại tại Emotor nhé!"
    - text: "Cảm ơn bạn đã ghé qua 💚, chúc một ngày đầy năng lượng xanh 🌿"

actions:
  - action_hoi_thong_tin_ve_xe
  - utter_chao_hoi
  - utter_hoi_khuyen_mai
  - utter_hoi_loai_xe
  - utter_hoi_thuong_hieu
  - utter_hoi_bao_hanh
  - utter_hoi_dia_chi
  - utter_hoi_mua_xe
  - utter_hoi_ho_tro
  - utter_cam_on
  - utter_tam_biet

session_config:
  session_expiration_time: 60 # phút
  carry_over_slots_to_new_session: true
