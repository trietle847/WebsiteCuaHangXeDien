      - alo
      - chào em
      - chào anh 
      - chào 
      - cho tôi hỏi

  # ====== 2. HỎI GIÁ XE ======
  - intent: hoi_gia
    examples: |
      - giá xe bao nhiêu
      - xe này giá sao
      - xe này mắc không
      - xe có đắt không
      - giá xe điện là bao nhiêu vậy
      - bao nhiêu tiền một chiếc
      - xe emotor có đắt không
      - xe rẻ nhất bên bạn là bao nhiêu
      - xe xịn nhất bao nhiêu tiền
      - giá các mẫu xe hiện tại
      - giá xe [VinFast Evo 200](mau_xe) bao nhiêu
      - xe [Yadea G5](mau_xe) có giá tầm nhiêu
      - cho tôi hỏi giá xe [Dibao Pansy S](mau_xe)
      - giá của xe [Move Stronger Pro](mau_xe)
  # ===== Regex hỗ trợ phát hiện câu hỏi giá =====
  - regex: gia_xe
    examples: |
      - giá\s?(xe)?(\sđiện)?(\sbao\s?nhiêu)?
      - bao nhiêu
      - bao nhiêu tiền
      - giá là bao nhiêu
      - mắc không
      - đắt không

