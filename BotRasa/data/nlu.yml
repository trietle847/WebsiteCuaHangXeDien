      - chỉ đường tới cửa hàng Emotor
  # ===== Regex hỗ trợ phát hiện địa chỉ =====
  - regex: dia_chi
    examples: |
      - ở\s?(đâu|chỗ\s?nào)
      - (TP\.?HCM|Hà\s?Nội|Đà\s?Nẵng)
      - chi\s?nhánh

