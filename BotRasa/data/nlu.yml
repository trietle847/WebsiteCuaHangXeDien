    examples: |
      - bảo\s?hành
      - sửa
      - đổi
      - bảo\s?trì
      - pin\s?hư

  # ====== 7. HỎI ĐỊA CHỈ / CHI NHÁNH ======
  - intent: hoi_dia_chi
    examples: |
      - cửa hàng ở đâu
